# Required settings
lang en_US.UTF-8
keyboard us
rootpw master
authconfig --enableshadow --enablemd5
timezone --utc Europe/Paris
url --mirrorlist=http://mirrors.fedoraproject.org/mirrorlist?repo=fedora-$releasever&arch=$basearch

# Optional settings
autopart --nolvm
bootloader --location=mbr --append="net.ifnames=0 biosdevname=0"
network
clearpart --all --initlabel
firewall --disabled
firstboot --disabled
install
network --bootproto=dhcp
reboot
selinux --disabled
skipx
text
zerombr

# Packages
%packages --ignoremissing
@core
#@base
@^minimal-environment
ssh
-wpa_supplicant
-alsa-*
-plymouth*
%end

# Post
%post
/usr/bin/dnf -y update
/usr/bin/dnf -y install epel-release
/usr/bin/dnf -y install redhat-lsb-core sudo wget
useradd --comment "Opennebula Admin" --groups wheel,adm,systemd-journal oneadmin
echo oneadmin | passwd oneadmin --stdin

# sudo
echo "oneadmin ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers.d/oneadmin
sed -i "s/^.*requiretty/#Defaults requiretty/" /etc/sudoers
%end