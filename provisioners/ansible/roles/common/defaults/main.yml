---
# Base packages installed on all supported systems.
common_packages:
  - vim
  - curl
  - bash-completion

# Small family-specific additions. Keep these conservative for image portability.
common_packages_by_family:
  RedHat:
    - acpid
    - net-tools
  Debian:
    - net-tools

# Optional timezone. Leave empty to skip.
common_timezone: ""

# MOTD and shell customization.
common_manage_motd: true
common_manage_ps1: true
common_motd_banner: "GoldImages"

# User and SSH management.
common_manage_users: false
common_users: []
common_ssh_users: []
common_authorized_keys: []

# Lightweight sshd settings.
common_manage_sshd: true
common_sshd_password_authentication: 'no'
common_sshd_permit_root_login: 'no'
common_sshd_pubkey_authentication: 'yes'

# Optional sysctl baseline.
common_sysctl:
  - key: net.ipv4.ip_forward
    value: '0'
  - key: net.ipv4.conf.all.accept_redirects
    value: '0'
  - key: net.ipv4.conf.all.send_redirects
    value: '0'
