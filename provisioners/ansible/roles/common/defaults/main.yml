---
# Toggle/debug
common_debug: false

# Packages
common_packages: []
common_packages_redhat: []
common_packages_debian: []

# Timezone / locale (optional)
common_timezone: ""   # e.g. "America/Denver" ; empty = don't change

# MOTD
common_manage_motd: true
common_motd_banner: "Goldimages"

# Users / SSH
# NOTE: For public repo safety, default to NO keys.
# In your build vars (packer vars), set common_ssh_users: ["vagrant"] if desired.
common_ssh_users: []          # e.g. ["vagrant"]
common_authorized_keys: []    # list of SSH public keys

# Optionally ensure users exist
common_manage_users: false
common_users: []
# Example:
# common_users:
#   - name: vagrant
#     groups: ["wheel"]
#     shell: /bin/bash
#     sudo_nopasswd: true

# SSH hardening (lightweight; for full hardening use dev-sec collection)
common_manage_sshd: true
common_sshd_password_authentication: "no"
common_sshd_permit_root_login: "no"
common_sshd_pubkey_authentication: "yes"

# sysctl basics (optional)
common_sysctl:
  - { key: "net.ipv4.ip_forward", value: "0" }
  - { key: "net.ipv4.conf.all.accept_redirects", value: "0" }
  - { key: "net.ipv4.conf.all.send_redirects", value: "0" }
