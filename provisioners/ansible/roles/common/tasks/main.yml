---
# This playbook contains common plays that will be run on all nodes.

- name: Include OS-specific variables.
  include_vars: "{{ ansible_facts['distribution']  | lower }}{{ ansible_facts['distribution_major_version'] }}.yml"

- name: Install common dependencies
  package:
    name: "{{ common_packages }}"
    update_cache: yes

- name: Add motd
  template:
    src: "{{ ansible_facts['distribution'] | lower }}.j2"
    dest: /etc/motd
  tags: motd

- name: Set up authorized keys
  authorized_key:
    user: vagrant
    state: present
    key: 'ssh-rsa  fred@deneb'

# configuration general pour toutes les distrib RedHat
- include: redhat.yml
  when: ansible_os_family == 'RedHat'
