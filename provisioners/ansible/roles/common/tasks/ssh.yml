---
- name: Common | Check whether sshd_config exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: common_sshd_config

- name: Common | Install authorized keys for managed users
  ansible.posix.authorized_key:
    user: "{{ item.0 }}"
    key: "{{ item.1 }}"
    state: present
    manage_dir: true
  loop: "{{ common_ssh_users | product(common_authorized_keys) | list }}"
  when:
    - common_ssh_users | length > 0
    - common_authorized_keys | length > 0

- name: Common | Configure sshd settings
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^{{ item.key }}\\s+"
    line: "{{ item.key }} {{ item.value }}"
    create: false
  loop:
    - key: PasswordAuthentication
      value: "{{ common_sshd_password_authentication }}"
    - key: PermitRootLogin
      value: "{{ common_sshd_permit_root_login }}"
    - key: PubkeyAuthentication
      value: "{{ common_sshd_pubkey_authentication }}"
  when:
    - common_manage_sshd | bool
    - common_sshd_config.stat.exists | default(false)
  notify: Restart sshd
