---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: rocky9
    image: rockylinux:9
    privileged: true
    command: /bin/bash -c "sleep infinity"
    pre_build_image: true

provisioner:
  name: ansible
  options:
    become: false
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..

verifier:
  name: ansible
