---
- hosts: all
  become: yes
  gather_facts: yes
  roles:
    - role: common
  vars:
    user: admin
    common_packages:
      - cowsay
      - vim
      - net-tools
      - acpid
      - nftables
      - nutanix-guest-agent
      - tar
      - chkconfig
    remove_files:
      - base.repo
      - appstream.repo
      - nutanix.repo
  tasks:
    - name: Remove repo file
      ansible.builtin.file:
        path: /etc/yum.repos.d/{{ item }}
        state: absent
      loop: "{{  remove_files }}"
    - ansible.posix.sysctl:
        name: vm.swappiness
        value: '0'
        state: present
    - ansible.posix.sysctl:
        name: vm.overcommit_memory
        value: '1'
        state: present
    - ansible.posix.sysctl:
        name: vm.dirty_background_ratio
        value: '5'
        state: present
    - ansible.posix.sysctl:
        name: vm.dirty_ratio
        value: '15'
        state: present
    - ansible.posix.sysctl:
        name: vm.dirty_expire_centisecs
        value: '500'
        state: present
    - ansible.posix.sysctl:
        name: vm.dirty_writeback_centisecs
        value: '100'
        state: present
    - ansible.posix.sysctl:
        name: fs.aio-max-nr
        value: '3145728'
        state: present
    - ansible.posix.sysctl:
        name: fs.file-max
        value: '6815744'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.ip_local_port_range
        value: 1024 65000
        state: present
    - ansible.posix.sysctl:
        name: net.core.rmem_default
        value: '262144'
        state: present
    - ansible.posix.sysctl:
        name: net.core.wmem_default
        value: '262144'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.tcp_rmem
        value: '4096 262144 16777216'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.tcp_wmem
        value: '4096 262144 16777216'
        state: present
    - ansible.posix.sysctl:
        name: net.core.rmem_max
        value: '16777216'
        state: present
    - ansible.posix.sysctl:
        name: net.core.wmem_max
        value: '16777216'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.tcp_window_scaling
        value: '1'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.tcp_window_scaling
        value: '1'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.tcp_timestamps
        value: '1'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.tcp_sack
        value: '0'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: '0'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.conf.default.rp_filter
        value: '1'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.conf.default.accept_source_route
        value: '0'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.tcp_syncookies
        value: '1'
        state: present
    - ansible.posix.sysctl:
        name: net.core.netdev_max_backlog
        value: '5000'
        state: present
    - ansible.posix.sysctl:
        name: net.core.somaxconn
        value: '10000'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.tcp_fin_timeout 
        value: '15'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.tcp_tw_reuse
        value: '1'
        state: present
    - ansible.posix.sysctl:
        name: net.ipv4.tcp_max_syn_backlog
        value: '5000'
        state: present
    - name: Activate default nftable rules
      lineinfile:
        dest: /etc/sysconfig/nftables.conf
        regexp: '#include "/etc/nftables/main.nft"'
        line: 'include "/etc/nftables/main.nft"'
    - name: started nftables enabled
      ansible.builtin.systemd:
        name: nftables
        enabled: yes
        masked: no
    - name: started nftables started
      ansible.builtin.systemd_service:
        state: started
        daemon_reload: true
        name: nftables
    
    
  
